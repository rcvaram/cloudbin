[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "cloudbin"
version = "0.1.0"

description = "Privacy-focused file archiving using encrypted cloud storage"

readme = "README.md"

requires-python = ">=3.11"

license = { text = "MIT" }

authors = [
    { name = "Sivaram Rasathurai" },
]

keywords = [
    "backup",
    "archive",
    "encryption",
    "cloud-storage",
    "privacy",
    "file-protection",
    "rclone",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Operating System :: POSIX :: Linux",

    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Filesystems",
    "Topic :: Security",
]

dependencies = [
    "watchdog>=6.0.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.urls]
Homepage = "https://github.com/rcvaram/cloudbin"
Repository = "https://github.com/rcvaram/cloudbin"
Issues = "https://github.com/rcvaram/cloudbin/issues"


[project.scripts]
cloudbin = "cloudbin.cli:main"


[tool.setuptools.packages.find]
where = [
    "src",
]

include = [
    "cloudbin",
    "cloudbin.*",
]